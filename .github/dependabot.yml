version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait before proposing a brand-new release. A freshly published version has
    # had the least scrutiny, so a short delay lets a compromised or broken
    # release be yanked before it reaches a PR here (semgrep
    # `dependabot-missing-cooldown`).
    cooldown:
      default-days: 7
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
